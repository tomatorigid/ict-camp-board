name: 刷新看板数据

on:
  schedule:
    # UTC，每 10 分钟一次（GitHub 定时任务最小粒度 5 分钟，实际常延迟几分钟）
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取 CANNJudge 公开数据
        env:
          # 可选：在仓库 Settings→Secrets 里配 CANNJUDGE_ACCOUNT / CANNJUDGE_PASSWORD
          # （或直接配一条 CANNJUDGE_COOKIE 字符串），CI 就会自动刷新本队提交历史（history.mine）。
          # 不配也能跑：mine 历史保留旧数据，对手快照（rivals）照常增量更新。
          CANNJUDGE_COOKIE: ${{ secrets.CANNJUDGE_COOKIE }}
          CANNJUDGE_ACCOUNT: ${{ secrets.CANNJUDGE_ACCOUNT }}
          CANNJUDGE_PASSWORD: ${{ secrets.CANNJUDGE_PASSWORD }}
        run: python fetch_data.py

      - name: 有变化才提交
        run: |
          if git diff --quiet data.json; then
            echo "数据无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: 刷新 data.json ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
