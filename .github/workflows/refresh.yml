name: 刷新看板数据

on:
  schedule:
    - cron: "17 1,7,13,19 * * *" # UTC，每天 4 次（北京时间 09:17 / 15:17 / 21:17 / 03:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取 CANNJudge 公开数据
        run: python fetch_data.py

      - name: 有变化才提交
        run: |
          if git diff --quiet data.json; then
            echo "数据无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: 刷新 data.json ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
